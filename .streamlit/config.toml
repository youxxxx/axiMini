# SOC-style dark theme. The browser can still override via Settings → Theme.
[theme]
base = "dark"
primaryColor = "#4ade80"            # accent (OK / malicious-indicator highlight)
backgroundColor = "#0b1220"         # deep navy
secondaryBackgroundColor = "#111a2f"
textColor = "#e2e8f0"
font = "monospace"

[server]
headless = true                     # don't auto-open a browser each time
runOnSave = true                    # live edits while developing
